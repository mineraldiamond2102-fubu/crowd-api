<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混雑状況自動判定・送信カメラ</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f4f8; }
    #video { width: 100%; max-width: 600px; border-radius: 8px; background: #000; }
    #status { margin-top: 15px; font-weight: bold; font-size: 1.2em; color: #333; }
  </style>

  <!-- ブラウザ内でAI物体検出を行うライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx2Iphz0RxqttxjymoRCvo7vdKUMg9TJ31K97QlerFP-uxmSAjB8uVTU9Oe-QpODnPoQQ/exec";
    
    async function postCongestion(className, congestion, notice = "", reopenTime = "") {
      try {
        const params = new URLSearchParams({
          className: className,
          congestion: congestion,
          notice: notice,
          reopenTime: reopenTime
        });
    
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: params
        });
    
        if (!response.ok) {
          throw new Error(`HTTPエラー: ${response.status}`);
        }
    
        const result = await response.text();
    
        // GAS側から "OK" 以外が返った場合もエラー扱いにする
        if (result.trim() !== "OK") {
          throw new Error(result || "GASから正常な応答がありませんでした");
        }
    
        return true;
    
      } catch (error) {
        console.error(error);
        alert("送信に失敗しました。\n" + error.message);
        return false;
      }
    }
  </script>
</head>
<body>
  <h2>混雑状況自動判定・送信カメラ</h2>
  <p style="font-size: 0.9em; color: #666;">※AIが人数を測定し、3分間の平均から混雑度を自動判定・送信します。</p>
  
  <video id="video" autoplay playsinline muted></video>
  <div id="status">AIモデルを読み込み中...</div>

  <script>
    // ★ご自身の最新GAS WebアプリURLを設定してください（末尾は /exec）
    // const GAS_URL = 'https://script.google.com/macros/s/AKfycbx2Iphz0RxqttxjymoRCvo7vdKUMg9TJ31K97QlerFP-uxmSAjB8uVTU9Oe-QpODnPoQQ/exec';

    // ★基本設定
    const CLASS_NAME = '1年1組';             // クラス・団体名
    const THRESHOLD_SLIGHTLY_CROWDED = 5;  // 3人以上で「やや混雑」
    const THRESHOLD_CROWDED = 10;           // 6人以上で「混雑」

    // 集計設定（3分間隔）
    const SAMPLE_INTERVAL_MS = 5000; // 5秒ごとに計測
    const SAMPLES_TO_AVERAGE = 6;   // 36回 (5秒×36回 = 3分ごとに送信)

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    let model = null;
    let countBuffer = [];

    // 初期化処理
    async function init() {
      try {
        statusDiv.innerText = 'AIモデル（COCO-SSD）を読み込み中...';
        model = await cocoSsd.load();
        statusDiv.innerText = 'カメラを起動中...';

        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          statusDiv.innerText = 'カメラ接続完了。計測を開始します...';
          setInterval(detectAndAggregate, SAMPLE_INTERVAL_MS);
        };
      } catch (err) {
        console.error('初期化エラー:', err);
        statusDiv.innerText = `エラー: ${err.message}`;
      }
    }

    // AI解析と自動判定・送信
    async function detectAndAggregate() {
      if (!model || !video.videoWidth || !video.videoHeight) return;

      try {
        // 1. ブラウザ内で人物検出
        const predictions = await model.detect(video);
        const personPredictions = predictions.filter(p => p.class === 'person');
        const currentCount = personPredictions.length;

        countBuffer.push(currentCount);
        statusDiv.innerText = `計測中 (${countBuffer.length}/${SAMPLES_TO_AVERAGE}回): 今回 ${currentCount}人`;

        // 2. 36回（3分）に達したら平均人数と混雑度ステータスを算出
        if (countBuffer.length >= SAMPLES_TO_AVERAGE) {
          const sum = countBuffer.reduce((acc, val) => acc + val, 0);
          const avgCount = Math.round(sum / countBuffer.length);

          // 送信前に必ずバッファをリセット（エラー時の連続送信ループを防ぐ）
          countBuffer = [];

          // 人数から混雑度テキストを判定
          let congestionText = "空いている";
          if (avgCount >= THRESHOLD_CROWDED) {
            congestionText = "混雑";
          } else if (avgCount >= THRESHOLD_SLIGHTLY_CROWDED) {
            congestionText = "やや混雑";
          }

          statusDiv.innerText = `過去3分間の平均 (${avgCount}人 / ${congestionText}) を送信中...`;

/*=====================
          // 3. URLSearchParams 形式でデータを生成してPOST送信
          const params = new URLSearchParams({
            className: CLASS_NAME,
            congestion: congestionText,
            notice: "",
            reopenTime: ""
          });

          const response = await fetch(GAS_URL, {
            method: "POST",
            body: params
          });

          if (!response.ok) {
            throw new Error(`HTTPエラー: ${response.status}`);
          }

          const result = await response.text();
          if (result.trim() !== "OK") {
            throw new Error(result || "GASから正常な応答がありませんでした");
          }
================================*/
          postCongestion("9年9組", congestionText, "","");
          
          statusDiv.innerText = `送信完了！ 判定: ${congestionText} (${avgCount}人) [次回計測中...]`;
        }

      } catch (err) {
        console.error('解析/送信エラー:', err);
        statusDiv.innerText = `送信エラー: ${err.message} (次回の3分計測を継続します)`;
      }
    }

    // 6時間ごとに自動リロード
    setTimeout(() => {
      location.reload();
    }, 6 * 60 * 60 * 1000);

    init();
  </script>
</body>
</html>
