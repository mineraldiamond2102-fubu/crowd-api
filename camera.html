<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローカル解析混雑監視 - カメラ</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f4f8; }
    #video { width: 100%; max-width: 600px; border-radius: 8px; background: #000; }
    #status { margin-top: 15px; font-weight: bold; font-size: 1.2em; color: #333; }
  </style>

  <!-- ブラウザ内でAI物体検出を行うライブラリ (TensorFlow.js / COCO-SSD) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>
  <h2>🔒 ローカル解析・混雑監視カメラ</h2>
  <p style="font-size: 0.9em; color: #666;">※画像データは外部へ一切送信されず、端末内で安全に処理されます。</p>
  
  <video id="video" autoplay playsinline muted></video>
  <div id="status">AIモデルを読み込み中...</div>

  <script>
    // ★ご自身のGASのWebアプリURLを設定してください
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyxi-Nh1zXLuYWHCXeLugEIMMUt4VEQBEiqG8hl1Kg5/dev';

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    let model = null;

    // AIモデルのロードとカメラの起動
    async function init() {
      try {
        statusDiv.innerText = 'AIモデル（COCO-SSD）を読み込み中...';
        // ブラウザ上でモデルを読み込む（初回のみ軽量モデルをロード）
        model = await cocoSsd.load();
        statusDiv.innerText = 'カメラを起動中...';

        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          statusDiv.innerText = 'カメラ接続完了。ローカル解析を開始します...';
          // 5秒周期で端末内AI解析を実施
          setInterval(detectAndSend, 5000);
        };
      } catch (err) {
        console.error('初期化エラー:', err);
        statusDiv.innerText = `エラー: ${err.message}`;
      }
    }

    // ブラウザ内で画像を解析して「人数」だけをGASへ送信
    async function detectAndSend() {
      if (!model || !video.videoWidth || !video.videoHeight) return;

      try {
        statusDiv.innerText = '端末内で画像解析中...';

        // 1. ブラウザ内でAI判定（画像データは送信されない）
        const predictions = await model.detect(video);
        
        // 2. 検出結果から「person（人）」だけをカウント
        const personPredictions = predictions.filter(p => p.class === 'person');
        const count = personPredictions.length;

        statusDiv.innerText = `解析完了！ 現在の検出人数: ${count}人（GASへ送信中...）`;

        // 3. 数値とタイムスタンプのみをGASへ直接送信
        if (GAS_URL && GAS_URL !== 'YOUR_GAS_WEBAPP_URL') {
          await fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors', // GASへのCORSクロスドメイン送信設定
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              count: count,
              timestamp: new Date().toISOString()
            })
          });
          statusDiv.innerText = `解析成功！ 現在の検出人数: ${count}人 (記録完了)`;
        } else {
          statusDiv.innerText = `解析成功！ 現在の検出人数: ${count}人 (GAS URL未設定)`;
        }

      } catch (err) {
        console.error('解析/送信エラー:', err);
        statusDiv.innerText = `エラー発生: ${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
